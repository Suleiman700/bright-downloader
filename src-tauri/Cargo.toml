[package]
name = "brightdl"
description = "Bright Downloader - free, open-source multi-connection download manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "brightdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dm-engine = { path = "../crates/engine" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
reqwest.workspace = true
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_DataExchange", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
futures-util.workspace = true
