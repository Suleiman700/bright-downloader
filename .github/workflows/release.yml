# Push a tag such as v0.2.0 (it must match `version` in Cargo.toml) to build
# the Windows installer and portable zip and create a DRAFT release with them
# and SHA256SUMS.txt.
# Edit the notes if you like, then press "Publish release": only then do
# installed copies see the update and offer it to their users.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: pnpm tauri build --bundles nsis

      # GitHub turns spaces in asset names into dots, so give the files names
      # without spaces; SHA256SUMS.txt must list the names users download.
      # The portable zip is the program plus portable.txt, which makes it keep
      # its data in a "data" folder next to it.
      - name: Name the installer, build the portable zip and write checksums
        shell: bash
        run: |
          mkdir out portable
          cp target/release/bundle/nsis/*-setup.exe "out/Bright-Downloader_${VERSION}_x64-setup.exe"
          cp target/release/brightdl.exe portable/
          cp src-tauri/portable.txt portable/
          (cd portable && 7z a -tzip "../out/Bright-Downloader_${VERSION}_x64-portable.zip" brightdl.exe portable.txt)
          cd out
          sha256sum *-setup.exe *-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft \
            --title "Bright Downloader $VERSION" \
            --notes-file RELEASE_NOTES.md
